<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rise of the Tomb Raider Nexus - Mods and community</title></head>
<body>
<!-- Shaped like the classic files tab in its archived category (riseofthetombraider/mods/23?tab=files&category=archived,
     issue #33), not a live snapshot. Every file is a dt.file-expander-header with its own dd beside it, all in one
     dl; the dd holds the file's ul.accordion-downloads, which Nexus leaves without download buttons for an
     archived file. -->
<section id="section" data-game-id="2178"><div class="tabs"><div class="tabcontent tabcontent-mod-page">
<div class="container mod-files" id="mod_files">
<div class="file-category" id="file-container-archived-files">
<h2>Archived files</h2>
<div class="files-tabs"><dl class="accordion">
<dt id="file-expander-header-301" class="file-expander-header clearfix accopen" data-id="301" data-name="Texture pack" data-version="1.2">
  <div class="stat-container"><ul class="stats clearfix"><li class="stat-version"><div class="statitem"><div class="stat">1.2</div></div></li></ul></div>
  <p>Texture pack</p>
</dt>
<dd class="clearfix open" data-id="301">
  <div class="tabbed-block"><ul class="accordion-downloads clearfix"><li><a class="btn inline-flex" href="#preview-301"><span class="flex-label">Preview file contents</span></a></li></ul></div>
  <div class="files-description"><p>Older textures.</p></div>
</dd>
<dt id="file-expander-header-202" class="file-expander-header clearfix" data-id="202" data-name="Texture pack" data-version="1.1">
  <div class="stat-container"><ul class="stats clearfix"><li class="stat-version"><div class="statitem"><div class="stat">1.1</div></div></li></ul></div>
  <p>Texture pack</p>
</dt>
<dd class="clearfix" data-id="202" style="display: none;">
  <div class="tabbed-block"><ul class="accordion-downloads clearfix"><li><a class="btn inline-flex" href="#preview-202"><span class="flex-label">Preview file contents</span></a></li></ul></div>
  <div class="files-description"><p>Older textures.</p></div>
</dd>
<dt id="file-expander-header-101" class="file-expander-header clearfix" data-id="101" data-name="Texture pack" data-version="1.0">
  <div class="stat-container"><ul class="stats clearfix"><li class="stat-version"><div class="statitem"><div class="stat">1.0</div></div></li></ul></div>
  <p>Texture pack</p>
</dt>
<dd class="clearfix" data-id="101" style="display: none;">
  <div class="tabbed-block"><ul class="accordion-downloads clearfix"></ul></div>
  <div class="files-description"><p>First release.</p></div>
</dd>
</dl></div>
</div>
<div id="files-tab-footer"><p>Looking for older files? They are in the archive.</p></div>
</div>
</div></div></section>
</body></html>
