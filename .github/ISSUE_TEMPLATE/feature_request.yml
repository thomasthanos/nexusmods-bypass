name: "NexusMods Bypass — Feature request"
description: "Suggest something the extension should do, or do differently."
title: "[Feature Request] "
labels: ["enhancement", "nexusmods-bypass"]
body:
  - type: markdown
    attributes:
      value: |
        **Something broken instead?** Use the bug report form: it carries the diagnostic report that
        makes a fault findable.

        Searching the open issues first is worth a moment: if someone has asked for the same thing,
        a 👍 or a comment there helps more than a second issue.
  - type: textarea
    id: request
    attributes:
      label: What would you like the extension to do?
      placeholder: "Expand the requirements screen on its own, so…"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why, and where?
      description: The page or step it is for (a mod page, a collection, Vortex, Mod Organizer 2…) and what it would save you.
    validations:
      required: false
