name: "NexusMods Bypass — Bug report"
description: "Report a problem with the NexusMods Bypass extension. The extension pre-fills this form for you."
title: "[Bug] "
labels: ["bug", "nexusmods-bypass"]
body:
  - type: markdown
    attributes:
      value: |
        **The extension fills this form in for you.** Open its popup on a Nexus Mods page →
        **Help & Bugs** → **Report a bug**. GitHub reopens with the diagnostic report and your
        browser version already in place, and you only have to describe what you were doing.

        Writing this by hand instead is fine, but the report is what makes a fault findable —
        without it there is usually nothing to go on. Go and press that button, then paste what
        it gives you into the second field.

        The report starts with a **Report ID**. Searching this repository for that ID first is
        worth a moment: the same fault always produces the same ID, so if it already appears in
        an open issue, please comment there instead of opening a new one.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: "I clicked 'Download all mods' on a collection and…"
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: "Filled in for you if you used the extension's Report a bug button. If it is empty, that button is in the popup under Help & Bugs — press it and this field will be filled in for you."
      render: text
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser & version
      description: "Auto-filled by the extension. Fill it in yourself only if it is empty."
      placeholder: "Chrome 138"
    validations:
      required: false
