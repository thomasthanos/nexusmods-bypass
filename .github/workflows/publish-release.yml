name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostics:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, 'chore(release): publish '))
    uses: ./.github/workflows/diagnostics-check.yml

  publish:
    needs: diagnostics
    # Publication is deliberate: ordinary merges never create a release.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, 'chore(release): publish '))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read and validate release version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const version = read('src/manifest.json').version;
          const lock = read('package-lock.json');
          if (!/^\d+\.\d+\.\d+$/.test(version) || read('package.json').version !== version ||
              lock.version !== version || lock.packages[''].version !== version) {
            throw new Error('Manifest and tooling versions must match.');
          }
          const notes = `internal/docs/releases/${version}.md`;
          if (!fs.existsSync(notes)) {
            throw new Error(`Missing release notes for ${version}.`);
          }
          // The title is the notes' "## <version> — <subtitle>" heading, so each release is named for
          // what it ships (it was hard-coded, and every release would have had 3.1.7's name).
          const escaped = version.replace(/\./g, '\\.');
          const heading = new RegExp(`^##\\s+v?${escaped}\\s+[—–-]\\s+(.+?)\\s*$`, 'm').exec(fs.readFileSync(notes, 'utf8'));
          const title = heading ? `v${version} — ${heading[1]}` : `v${version}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntitle=${title.replace(/[\r\n]+/g, ' ')}\n`);
          NODE
      - run: npm ci --workspaces=false
      - run: npm run lint
      - name: Regression tests and browser packages
        run: node tools/build-zip.mjs
        env:
          NXTK_REQUIRE_DOM: '1'
      - name: Firefox package lint
        run: node tools/lint-webext.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      # A Nexus outage or an unrelated schema change must not block a release. The weekly schema-watch.yml still reports it.
      - name: Validate live Nexus schema
        continue-on-error: true
        run: node tools/schema-watch.mjs
      - name: Publish both validated packages
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          notes="internal/docs/releases/${VERSION}.md"
          published_before=false
          if gh release view "$VERSION" --json isDraft --jq '.isDraft' > /tmp/release-is-draft; then
            if [ "$(cat /tmp/release-is-draft)" = "false" ]; then
              published_before=true
              echo "Refreshing the validated packages and notes of release ${VERSION}."
            fi
          else
            gh release create "$VERSION" --draft --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file "$notes"
          fi
          gh release upload "$VERSION" \
            "dist/nexus.mods.bypass-${VERSION}.zip" \
            "dist/nexus.mods.bypass-${VERSION}-firefox.zip" --clobber
          # A deliberate same-version refresh keeps the release ID and URL, but its source tag
          # must identify the commit that passed the gates and produced these two packages.
          if gh api "repos/${GH_REPO}/git/ref/tags/${VERSION}" > /tmp/release-tag-ref; then
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${VERSION}" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f ref="refs/tags/${VERSION}" -f sha="$GITHUB_SHA" > /dev/null
          fi
          gh release edit "$VERSION" --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file "$notes" --draft=false --latest
          if [ "$published_before" = "false" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
          fi
      # A release published with the workflow's token starts no other workflow, so discord-notify.yml
      # never hears of it (no notice went out for 3.1.6 or 3.1.7). Only a release published just now is
      # announced; a same-version package refresh does not announce the release again.
      - name: Announce the release on Discord
        if: steps.publish.outputs.published == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          R_NAME: ${{ steps.version.outputs.title }}
        # Skips without the secret; waits out Discord rate limits; a failed post is a warning only.
        run: |
          R_URL="$(gh release view "$VERSION" --json url --jq .url)" \
          R_BODY="$(cat "internal/docs/releases/${VERSION}.md")" \
            node tools/discord-notification.mjs release --send
