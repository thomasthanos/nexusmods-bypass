name: Diagnostics checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The diagnostics workspace only, from the one lockfile at the repository root.
      - run: npm ci -w diagnostics
        working-directory: .
      - name: Binding types, TypeScript and diagnostics regressions
        run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - name: Mobile PWA browser tests
        run: npm run test:browser
      - name: WebKit mobile PWA and protected mutation regressions
        run: npm run test:browser
        env:
          NXTK_DIAGNOSTICS_BROWSER: webkit
      - name: Worker bundle without deployment
        run: npx wrangler deploy --dry-run --outdir .wrangler/release-dry-run
      - name: Portable authenticated dashboard bundle
        run: node tools/build-portable-worker.mjs
      - name: Upload diagnostics screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-screenshots
          path: diagnostics/.wrangler/browser-qa/
          include-hidden-files: true
          retention-days: 14
