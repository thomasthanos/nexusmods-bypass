name: Release gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The locale check, every regression suite, and the Chrome and Firefox package checks.
      - run: node tools/build-zip.mjs
