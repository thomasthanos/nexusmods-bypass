title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        **Something broken instead?** Use the [bug report form](https://github.com/thomasthanos/nexusmods-bypass/issues/new?template=nexus_bug_report.yml):
        it carries the diagnostic report that makes a fault findable.

        The [troubleshooting section](https://github.com/thomasthanos/nexusmods-bypass#-troubleshooting)
        answers the common ones: downloads that pause, ask you to sign in, or stop at a Cloudflare check.
  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
      placeholder: "How do I send a whole collection to Vortex…"
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What did you try?
      description: The page you were on and what happened, if it helps.
    validations:
      required: false
