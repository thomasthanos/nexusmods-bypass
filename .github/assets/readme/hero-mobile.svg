<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-labelledby="title description">
<title id="title">NexusMods Bypass 3.0.0</title><desc id="description">Collection downloads under control. An animated queue connects to browser and Vortex downloads.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif}.route{fill:none;stroke:#75d6c5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.packet{fill:none;stroke:#f5f4ef;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 160;animation:travel 6s linear infinite}.progress{stroke-dasharray:80 140;animation:queue 6s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-170}}@keyframes queue{0%,100%{stroke-dashoffset:65}55%{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.packet,.progress{animation:none!important}}</style>
