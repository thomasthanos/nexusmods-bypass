<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="126" viewBox="0 0 1000 126" role="img" aria-labelledby="title description">
  <title id="title">Explore NexusMods Bypass 3.0.0</title>
  <desc id="description">Major update available on GitHub. View the release notes and downloads. Store versions may differ.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1e3853"/><stop offset="1" stop-color="#13263e"/></linearGradient></defs>
  <rect x="1" y="1" width="998" height="124" rx="18" fill="url(#bg)" stroke="#4f6b89" stroke-opacity=".65"/>
  <path d="M1 25V100" stroke="#75d6c5" stroke-width="3"/>
  <rect x="26" y="28" width="100" height="70" rx="15" fill="#75d6c5"/>
  <text x="76" y="72" text-anchor="middle" fill="#13263e" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="750">3.0.0</text>
  <g font-family="Segoe UI,Arial,sans-serif"><text x="150" y="44" fill="#f2f6fc" font-size="23" font-weight="650">A major update, ready on GitHub.</text><text x="150" y="72" fill="#c1cede" font-size="17">Download reliability, responsive UI and clearer reports.</text><text x="150" y="99" fill="#a4b9ce" font-size="14">Store versions may differ from the GitHub release.</text></g>
  <rect x="756" y="42" width="216" height="42" rx="11" fill="#2a4662" stroke="#69849e" stroke-opacity=".5"/>
  <text x="780" y="69" fill="#f2f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Explore the release</text><path d="M943 56l8 7-8 7" fill="none" stroke="#75d6c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
