<style>text{font-family:"Segoe UI",Arial,sans-serif}.shine{transform:translateX(-600px);}@keyframes shine{0%,20%{transform:translateX(-600px)}65%,100%{transform:translateX(600px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
