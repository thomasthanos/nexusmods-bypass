<style>text{font-family:"Segoe UI",Arial,sans-serif}.shine{transform:translateX(-130px);animation:shine 10s ease-in-out -0.5s infinite;}@keyframes shine{0%,20%{transform:translateX(-130px)}65%,100%{transform:translateX(130px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
