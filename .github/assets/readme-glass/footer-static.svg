<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="158" viewBox="0 0 1000 158" role="img" aria-labelledby="title description">
<title id="title">Made for the long mod list.</title><desc id="description">NexusMods Bypass by ThomasThanos. Choose your files. Keep your place.</desc>
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#254362"/><stop offset=".55" stop-color="#122b48"/><stop offset="1" stop-color="#24334f"/></linearGradient>
<linearGradient id="frost" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".23"/><stop offset=".45" stop-color="#cceaff" stop-opacity=".035"/><stop offset="1" stop-color="#c1d7ff" stop-opacity=".11"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fcff" stop-opacity=".85"/><stop offset=".35" stop-color="#aedcff" stop-opacity=".16"/><stop offset="1" stop-color="#a7e6e1" stop-opacity=".48"/></linearGradient>
<linearGradient id="sheen"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#a7e6e1" stop-opacity=".42"/><stop offset="1" stop-color="#a7e6e1" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-15%" y="-30%" width="130%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#020c1b" flood-opacity=".55"/></filter>
<clipPath id="clip"><rect x="6" y="5" width="988" height="139" rx="22"/></clipPath>
</defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif}.shine{transform:translateX(-1000px);}@keyframes shine{0%,20%{transform:translateX(-1000px)}65%,100%{transform:translateX(1000px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="6" y="11" width="988" height="139" rx="22" fill="#091c32" stroke="#031326"/>
<rect x="6" y="5" width="988" height="139" rx="22" fill="url(#base)" filter="url(#shadow)"/>
<g clip-path="url(#clip)"><ellipse cx="170" cy="31.6" rx="330" ry="150.1" fill="url(#halo)"/><rect x="6" y="5" width="988" height="139" fill="url(#frost)"/><g class="shine"><path d="M0 0H280L70 158H-210Z" fill="url(#sheen)"/></g></g>
<rect x="6" y="5" width="988" height="139" rx="22" fill="none" stroke="url(#rim)" stroke-width="1.3"/>
<path d="M28 7H972" stroke="#fff" stroke-opacity=".28" stroke-linecap="round"/>
<path d="M28 145H972" stroke="#a7e6e1" stroke-opacity=".25" stroke-linecap="round"/>
<rect x="30" y="28" width="108" height="90" rx="20" fill="#0a1e34" stroke="#a7e6e1" stroke-opacity=".5"/><text x="84" y="84" text-anchor="middle" fill="#a7e6e1" font-size="27" font-weight="750">NXT</text><text x="165" y="55" fill="#f4f9ff" font-size="27" font-weight="650">Made for the long mod list.</text><text x="165" y="89" fill="#d5e4f2" font-size="19">NexusMods Bypass by ThomasThanos</text><text x="165" y="119" fill="#b5cadd" font-size="17">Choose your files. Keep your place.</text><path d="M947 60l12 12-12 12" fill="none" stroke="#a7e6e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
