<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title description">
  <title id="title">NexusMods Bypass 3.1.6</title>
  <desc id="description">A glass download tile with a gently moving arrow. Clearer reports and optional diagnostics. Chrome, Edge and Firefox; 13 interface languages.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#242932"/><stop offset=".52" stop-color="#131722"/><stop offset="1" stop-color="#27201c"/>
    </linearGradient>
    <linearGradient id="rim" x2=".8" y2="1">
      <stop stop-color="#f4e5d4" stop-opacity=".55"/><stop offset=".45" stop-color="#b9bfd1" stop-opacity=".1"/><stop offset="1" stop-color="#eaa14c" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="tile" x2=".7" y2="1">
      <stop stop-color="#d3ae7d" stop-opacity=".38"/><stop offset=".45" stop-color="#644a32" stop-opacity=".6"/><stop offset="1" stop-color="#261e19" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="depth" x2="0" y2="1">
      <stop stop-color="#80562f"/><stop offset="1" stop-color="#251e19"/>
    </linearGradient>
    <linearGradient id="arrow" x2="0" y2="1">
      <stop stop-color="#fff7e9"/><stop offset="1" stop-color="#eaa14c"/>
    </linearGradient>
    <linearGradient id="reflection" x2="1" y2=".3">
      <stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warmth">
      <stop stop-color="#eaa14c" stop-opacity=".2"/><stop offset="1" stop-color="#eaa14c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel"><rect x="1" y="1" width="1098" height="298" rx="28"/></clipPath>
    <clipPath id="tile-clip"><rect x="62" y="68" width="144" height="144" rx="38"/></clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI Variable Display", "Segoe UI", Arial, sans-serif; }
    .download-arrow { animation: arrive 6s cubic-bezier(.4,0,.2,1) infinite; }
    .reflection { animation: polish 6s ease-in-out infinite; }
    @keyframes arrive {
      0%, 12%, 72%, 100% { transform: translateY(0); }
      34% { transform: translateY(10px); }
      48% { transform: translateY(-3px); }
      60% { transform: translateY(0); }
    }
    @keyframes polish {
      0%, 12% { transform: translateX(-170px); opacity: 0; }
      18% { opacity: 1; }
      56% { transform: translateX(170px); opacity: 1; }
      64%, 100% { transform: translateX(170px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .download-arrow, .reflection { animation: none; }
      .reflection { opacity: 0; }
    }
  </style>
  <rect x="1" y="1" width="1098" height="298" rx="28" fill="url(#surface)" stroke="url(#rim)" stroke-width="2"/>
  <g clip-path="url(#panel)">
    <ellipse cx="138" cy="154" rx="265" ry="210" fill="url(#warmth)"/>
    <path d="M24 2H1076" stroke="#fff" stroke-opacity=".15"/>
    <ellipse cx="134" cy="226" rx="86" ry="12" fill="#000" fill-opacity=".25"/>
    <rect x="62" y="77" width="144" height="144" rx="38" fill="url(#depth)" stroke="#eaa14c" stroke-opacity=".25"/>
    <rect x="62" y="68" width="144" height="144" rx="38" fill="url(#tile)" stroke="url(#rim)" stroke-width="1.5"/>
    <path d="M83 80Q88 77 102 77H166" fill="none" stroke="#fff1d8" stroke-opacity=".25" stroke-linecap="round"/>
    <g clip-path="url(#tile-clip)">
      <path class="reflection" d="M57 67H93L182 213H146Z" fill="url(#reflection)"/>
    </g>
    <g class="download-arrow">
      <path d="M126 104H142V138H160L134 164L108 138H126Z" fill="#000" fill-opacity=".24" transform="translate(0 3)"/>
      <path d="M126 104H142V138H160L134 164L108 138H126Z" fill="url(#arrow)"/>
    </g>
    <path d="M108 174H160" stroke="#fff1d8" stroke-width="6" stroke-linecap="round"/>
    <path d="M240 67V230" stroke="#f4f5f8" stroke-opacity=".1"/>
    <text x="276" y="115" font-size="43" font-weight="700" letter-spacing="-1.1" fill="#f4f5f8">NexusMods Bypass</text>
    <text x="278" y="158" font-size="22" fill="#e0d7cd">Clearer reports. Your choice.</text>
    <text x="278" y="191" font-size="18" fill="#a8a8b4">Compact summaries and optional diagnostics.</text>
    <text x="278" y="235" font-size="16" fill="#b8b9c3">Chrome / Edge / Firefox</text>
    <circle cx="479" cy="230" r="2" fill="#eaa14c"/>
    <text x="493" y="235" font-size="16" fill="#b8b9c3">13 languages</text>
    <rect x="934" y="53" width="108" height="42" rx="21" fill="#eaa14c" fill-opacity=".1" stroke="#eaa14c" stroke-opacity=".4"/>
    <text x="988" y="81" text-anchor="middle" font-size="23" font-weight="700" fill="#f2b974">3.1.6</text>
  </g>
</svg>
