<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="106" viewBox="0 0 1000 106" role="img" aria-labelledby="title description">
  <title id="title">Made for the long mod list</title>
  <desc id="description">NexusMods Bypass by ThomasThanos.</desc>
  <style>
    text { font-family: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif; }
    .line { animation: travel 9s linear infinite; }
    .light { animation: pulse 3s ease-in-out infinite; }
    @keyframes travel { to { stroke-dashoffset: -52; } }
    @keyframes pulse { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18243d"/><stop offset="1" stop-color="#0d1729"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f1b071"/><stop offset=".55" stop-color="#8c9dfb"/><stop offset="1" stop-color="#79ded1"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="104" rx="20" fill="url(#bg)" stroke="url(#edge)" stroke-opacity=".68" stroke-width="1.5"/>
  <path d="M58 54h105m674 0h105" fill="none" stroke="#405677" stroke-width="2.5" stroke-linecap="round"/>
  <path class="line" d="M58 54h105m674 0h105" fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-dasharray="16 36" stroke-linecap="round"/>
  <circle class="light" cx="58" cy="54" r="5.5" fill="#f2b77c"/>
  <circle class="light" cx="163" cy="54" r="5.5" fill="#79ded1" style="animation-delay:-1.5s"/>
  <circle class="light" cx="837" cy="54" r="5.5" fill="#8e9ffd" style="animation-delay:-.8s"/>
  <circle class="light" cx="942" cy="54" r="5.5" fill="#79ded1" style="animation-delay:-2s"/>
  <text x="500" y="48" text-anchor="middle" fill="#f6f8ff" font-size="26" font-weight="800">Made for the long mod list.</text>
  <text x="500" y="75" text-anchor="middle" fill="#adbed8" font-size="15">NexusMods Bypass · ThomasThanos</text>
</svg>
