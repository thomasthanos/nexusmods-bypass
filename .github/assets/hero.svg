<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title description">
  <title id="title">NexusMods Bypass</title>
  <desc id="description">A compact animated queue card above the project name.</desc>
  <style>
    text { font-family: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif; }
    .card { animation: float 4.8s ease-in-out infinite; }
    .flow { animation: flow 7s linear infinite; }
    .dot { animation: pulse 3s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-5px); } }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    @keyframes pulse { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142038"/><stop offset=".55" stop-color="#0c1729"/><stop offset="1" stop-color="#08121f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#efa96f"/><stop offset=".5" stop-color="#8c9df8"/><stop offset="1" stop-color="#6edacc"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#efa96f"/><stop offset="1" stop-color="#70ddd0"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#6ed9d0" stop-opacity=".16"/><stop offset="1" stop-color="#6ed9d0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45" fill="none" stroke="#a8bad8" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="clip"><rect width="1100" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1100" height="360" fill="url(#bg)"/>
    <rect width="1100" height="360" fill="url(#grid)"/>
    <ellipse cx="566" cy="140" rx="430" ry="220" fill="url(#glow)"/>
    <path d="M1 1h1098" stroke="url(#edge)" stroke-width="2"/>
    <g fill="#c1d0ea">
      <circle class="dot" cx="104" cy="63" r="2"/><circle class="dot" cx="962" cy="94" r="2"/>
      <circle class="dot" cx="850" cy="44" r="1.5"/><circle class="dot" cx="205" cy="268" r="1.5"/>
    </g>
    <path d="M300 92h145m210 0h145" stroke="#536783" stroke-width="2"/>
    <path class="flow" d="M300 92h145m210 0h145" stroke="url(#bar)" stroke-width="2" stroke-dasharray="18 38"/>
    <g class="card">
      <rect x="445" y="23" width="210" height="137" rx="23" fill="#1e2c49" stroke="#8295b9" stroke-opacity=".8" stroke-width="1.5"/>
      <rect x="462" y="40" width="176" height="103" rx="15" fill="#0c1628" stroke="#435675"/>
      <circle cx="481" cy="58" r="3.4" fill="#ee9fa9"/><circle cx="494" cy="58" r="3.4" fill="#f0b778"/><circle cx="507" cy="58" r="3.4" fill="#76d5b9"/>
      <text x="622" y="62" text-anchor="end" fill="#b2bfda" font-size="10" font-weight="700" letter-spacing="1.3">QUEUE / READY</text>
      <path d="M484 88h32l14 16h25m-71 16h34l12-16h25m0 0h60" fill="none" stroke="url(#bar)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="dot" cx="484" cy="88" r="5.5" fill="#f4ae74"/>
      <circle class="dot" cx="484" cy="120" r="5.5" fill="#96a7ff"/>
      <circle class="dot" cx="615" cy="104" r="6.5" fill="#72dbcf"/>
      <rect x="481" y="133" width="138" height="2.5" rx="1.25" fill="#31425e"/>
      <rect x="481" y="133" width="96" height="2.5" rx="1.25" fill="url(#bar)"/>
    </g>
    <text x="550" y="232" text-anchor="middle" fill="#f7f9ff" font-size="54" font-weight="800" letter-spacing="-1.6">NexusMods Bypass<tspan fill="#70dfd0">.</tspan></text>
    <text x="550" y="269" text-anchor="middle" fill="#b8c5db" font-size="23" font-weight="500">Collections in motion. Downloads under control.</text>
    <g fill="none" stroke="#566b89" stroke-opacity=".8">
      <rect x="357" y="292" width="115" height="30" rx="15"/>
      <rect x="489" y="292" width="122" height="30" rx="15"/>
      <rect x="628" y="292" width="115" height="30" rx="15"/>
    </g>
    <g fill="#dce6f4" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      <text x="414.5" y="312">QUEUE</text><text x="550" y="312">PACE</text><text x="685.5" y="312">RESUME</text>
    </g>
  </g>
  <rect x="1" y="1" width="1098" height="358" rx="23" fill="none" stroke="url(#edge)" stroke-opacity=".7" stroke-width="1.5"/>
</svg>
