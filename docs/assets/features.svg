<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="304" viewBox="0 0 1200 304" role="img" aria-labelledby="t d">
  <title id="t">What it does</title>
  <desc id="d">Fewer clicks: Auto-start downloads, skip requirement screens, restore buttons on archived files.; Collection queue: Vortex or browser mode per run, smallest files first, pause between mods.; Pick up where you left off: Local history, revision comparison and a time-left estimate.; Official Nexus API: Collection, revision and file details, update badges, Endorse/Track.; Wabbajack (beta): Import a .wabbajack file or a .zip that contains one.; Safer handoff: Vortex tab countdown with Keep open, and a browser fallback for Cloudflare.; Reports &amp; debug log: Redacted report preview and an opt-in live debug log with export.; 13 languages: Every interface string translated, plus an Always use English switch.</desc>
  <style>text { font-family: "Segoe UI Variable Display", "Segoe UI", Arial, sans-serif; }
    .sheen { animation: glassSweep 10s ease-in-out infinite; }
    @keyframes glassSweep {
      0%, 8% { transform: translateX(0); opacity: 0; }
      18% { opacity: .45; }
      62% { transform: translateX(440px); opacity: .45; }
      70%, 100% { transform: translateX(440px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sheen { opacity: 0; } } .t { font-size:16.5px; font-weight:700; fill:#f4f5f8; } .d { font-size:13px; fill:#b8b9c3; }</style>
  <defs>
    <linearGradient id="face" x2=".7" y2="1"><stop stop-color="#30343d"/><stop offset=".48" stop-color="#191c25"/><stop offset="1" stop-color="#24201e"/></linearGradient>
    <linearGradient id="edge" x2=".8" y2="1"><stop stop-color="#f4e5d4" stop-opacity=".48"/><stop offset=".45" stop-color="#b9bfd1" stop-opacity=".1"/><stop offset="1" stop-color="#eaa14c" stop-opacity=".32"/></linearGradient>
    <linearGradient id="tile" x2=".7" y2="1"><stop stop-color="#d3ae7d" stop-opacity=".38"/><stop offset=".5" stop-color="#644a32" stop-opacity=".6"/><stop offset="1" stop-color="#261e19" stop-opacity=".95"/></linearGradient>
    <linearGradient id="accent" x2="0" y2="1"><stop stop-color="#ffe4b9"/><stop offset=".5" stop-color="#eaa14c"/><stop offset="1" stop-color="#9c652b"/></linearGradient>
    <linearGradient id="glass-reflection" x2="1" y2=".3"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
