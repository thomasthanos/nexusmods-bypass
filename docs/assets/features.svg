<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="304" viewBox="0 0 1200 304" role="img" aria-labelledby="t d">
  <title id="t">What it does</title>
  <desc id="d">Fewer clicks: Auto-start downloads, skip requirement screens, restore buttons on archived files.; Collection queue: Vortex or browser mode per run, smallest files first, pause between mods.; Pick up where you left off: Local history, revision comparison and a time-left estimate.; Official Nexus API: Collection, revision and file details, update badges, Endorse/Track.; Wabbajack (beta): Import a .wabbajack file or a .zip that contains one.; Safer handoff: Vortex tab countdown with Keep open, and a browser fallback for Cloudflare.; Reports &amp; debug log: Redacted report preview and an opt-in live debug log with export.; 13 languages: Every interface string translated, plus an Always use English switch.</desc>
  <style>
    text { font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .t { font-size: 16.5px; font-weight: 700; fill: #eef0ff; }
    .d { font-size: 13px; fill: #9aa3c7; }
    .card { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151c31"/><stop offset="1" stop-color="#0e1325"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#aab4ff" stop-opacity=".26"/><stop offset="1" stop-color="#aab4ff" stop-opacity=".07"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f0a24d"/><stop offset=".5" stop-color="#8b83ff"/><stop offset="1" stop-color="#45c8e6"/></linearGradient>
    <radialGradient id="glowA"><stop stop-color="#f0a24d" stop-opacity=".35"/><stop offset="1" stop-color="#f0a24d" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop stop-color="#8b83ff" stop-opacity=".32"/><stop offset="1" stop-color="#8b83ff" stop-opacity="0"/></radialGradient>
  </defs>
  <g class="card" style="animation-delay:0.00s"><rect x="12" y="16" width="282" height="128" rx="20" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5"/><rect x="30" y="34" width="36" height="36" rx="11" fill="#f0a24d" fill-opacity=".12" stroke="#f0a24d" stroke-opacity=".4"/><g transform="translate(34.0 38) scale(0.875)" fill="none" stroke="#f0a24d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5v15m-7-7 7 7 7-7M7 25h18"/></g><text x="78" y="58" class="t">Fewer clicks</text><text x="32" y="100" class="d">Auto-start downloads, skip</text><text x="32" y="118" class="d">requirement screens, restore buttons</text><text x="32" y="136" class="d">on archived files.</text></g><g class="card" style="animation-delay:0.12s"><rect x="310" y="16" width="282" height="128" rx="20" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5"/><rect x="328" y="34" width="36" height="36" rx="11" fill="#f0a24d" fill-opacity=".12" stroke="#f0a24d" stroke-opacity=".4"/><g transform="translate(332.0 38) scale(0.875)" fill="none" stroke="#f0a24d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h20M6 16h20M6 24h12"/></g><text x="376" y="58" class="t">Collection queue</text><text x="330" y="100" class="d">Vortex or browser mode per run,</text><text x="330" y="118" class="d">smallest files first, pause between</text><text x="330" y="136" class="d">mods.</text></g><g class="card" style="animation-delay:0.24s"><rect x="608" y="16" width="282" height="128" rx="20" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5"/><rect x="626" y="34" width="36" height="36" rx="11" fill="#f0a24d" fill-opacity=".12" stroke="#f0a24d" stroke-opacity=".4"/><g transform="translate(630.0 38) scale(0.875)" fill="none" stroke="#f0a24d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16a9 9 0 1 0 3-6.7M7 6v5h5"/></g><text x="674" y="58" class="t">Pick up where you left off</text><text x="628" y="100" class="d">Local history, revision comparison</text><text x="628" y="118" class="d">and a time-left estimate.</text></g><g class="card" style="animation-delay:0.36s"><rect x="906" y="16" width="282" height="128" rx="20" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5"/><rect x="924" y="34" width="36" height="36" rx="11" fill="#f0a24d" fill-opacity=".12" stroke="#f0a24d" stroke-opacity=".4"/><g transform="translate(928.0 38) scale(0.875)" fill="none" stroke="#f0a24d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10 4 16l6 6m12-12 6 6-6 6M18 7l-4 18"/></g><text x="972" y="58" class="t">Official Nexus API</text><text x="926" y="100" class="d">Collection, revision and file</text><text x="926" y="118" class="d">details, update badges,</text><text x="926" y="136" class="d">Endorse/Track.</text></g><g class="card" style="animation-delay:0.48s"><rect x="12" y="160" width="282" height="128" rx="20" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5"/><rect x="30" y="178" width="36" height="36" rx="11" fill="#f0a24d" fill-opacity=".12" stroke="#f0a24d" stroke-opacity=".4"/><g transform="translate(34.0 182) scale(0.875)" fill="none" stroke="#f0a24d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h22v5H5zM7 13v12h18V13M13 18h6"/></g><text x="78" y="202" class="t">Wabbajack (beta)</text><text x="32" y="244" class="d">Import a .wabbajack file or a .zip</text><text x="32" y="262" class="d">that contains one.</text></g><g class="card" style="animation-delay:0.60s"><rect x="310" y="160" width="282" height="128" rx="20" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5"/><rect x="328" y="178" width="36" height="36" rx="11" fill="#f0a24d" fill-opacity=".12" stroke="#f0a24d" stroke-opacity=".4"/><g transform="translate(332.0 182) scale(0.875)" fill="none" stroke="#f0a24d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16h16m-5-6 6 6-6 6M25 7v18"/></g><text x="376" y="202" class="t">Safer handoff</text><text x="330" y="244" class="d">Vortex tab countdown with Keep open,</text><text x="330" y="262" class="d">and a browser fallback for</text><text x="330" y="280" class="d">Cloudflare.</text></g><g class="card" style="animation-delay:0.72s"><rect x="608" y="160" width="282" height="128" rx="20" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5"/><rect x="626" y="178" width="36" height="36" rx="11" fill="#f0a24d" fill-opacity=".12" stroke="#f0a24d" stroke-opacity=".4"/><g transform="translate(630.0 182) scale(0.875)" fill="none" stroke="#f0a24d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6l2 3m8-3-2 3M10 13h12M16 13v12M5 13h4m14 0h4M5 19h4m14 0h4M10 9h12v8a6 6 0 0 1-12 0z"/></g><text x="674" y="202" class="t">Reports &amp; debug log</text><text x="628" y="244" class="d">Redacted report preview and an</text><text x="628" y="262" class="d">opt-in live debug log with export.</text></g><g class="card" style="animation-delay:0.84s"><rect x="906" y="160" width="282" height="128" rx="20" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5"/><rect x="924" y="178" width="36" height="36" rx="11" fill="#f0a24d" fill-opacity=".12" stroke="#f0a24d" stroke-opacity=".4"/><g transform="translate(928.0 182) scale(0.875)" fill="none" stroke="#f0a24d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4a12 12 0 1 0 0 24 12 12 0 0 0 0-24zM4 16h24M16 4c-4 4-4 20 0 24M16 4c4 4 4 20 0 24"/></g><text x="972" y="202" class="t">13 languages</text><text x="926" y="244" class="d">Every interface string translated,</text><text x="926" y="262" class="d">plus an Always use English switch.</text></g>
</svg>
