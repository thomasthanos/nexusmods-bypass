<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
  <title id="t">How it works</title>
  <desc id="d">Content scripts: UI and download clicks on nexusmods.com; Background queue: MV3 service worker paces the queue; Vortex or browser: nxm:// handoff or chrome.downloads; Optional relay: Opt-in reports via a Cloudflare Worker</desc>
  <style>
    text { font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; }
    .title { font-size: 19px; font-weight: 700; fill: #eef0ff; }
    .desc { font-size: 13.5px; fill: #9aa3c7; }
    .node { animation: node 4.5s ease-in-out infinite; }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 4.5s ease-in-out infinite; }
    @keyframes node { 0%, 100% { stroke-opacity: .3; } 10%, 36% { stroke-opacity: 1; } }
    @keyframes halo { 0%, 100% { opacity: 0; transform: scale(.8); } 14% { opacity: .55; transform: scale(1.15); } 36% { opacity: 0; transform: scale(1.3); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
