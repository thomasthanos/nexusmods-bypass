<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="contributing-title contributing-description">
  <title id="contributing-title">Contributing</title>
  <desc id="contributing-description">Bug reports, pull requests and the checks they run — NexusMods Bypass</desc>
  <style>
    text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
    .light-trail { stroke-dasharray: 115 990; animation: travel 12s linear infinite; }
    @keyframes travel { to { stroke-dashoffset: -1105; } }
    @media (prefers-reduced-motion: reduce) {
      .light-trail { animation: none; opacity: 0; }
      .motion { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10192d"/>
      <stop offset="0.52" stop-color="#0c1427"/>
      <stop offset="1" stop-color="#131b3b"/>
    </linearGradient>
    <linearGradient id="outline" x1="0" y1="0" x2="1200" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4c5f8c" stop-opacity="0.75"/>
      <stop offset="0.53" stop-color="#37445f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5d5a98" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="warm-haze">
      <stop stop-color="#e99446" stop-opacity="0.25"/>
      <stop offset="0.52" stop-color="#dc7534" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#dc7534" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-haze">
      <stop stop-color="#6255d9" stop-opacity="0.26"/>
      <stop offset="0.7" stop-color="#6255d9" stop-opacity="0.065"/>
      <stop offset="1" stop-color="#6255d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="680" y1="165" x2="1190" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#44518c" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#7466ed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a292ff" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="frame-clip"><rect x="9" y="9" width="1182" height="162" rx="22"/></clipPath>
  </defs>

  <rect x="9" y="9" width="1182" height="162" rx="22" fill="url(#surface)"/>
  <g clip-path="url(#frame-clip)">
    <ellipse cx="225" cy="80" rx="310" ry="153" fill="url(#warm-haze)"/>
    <ellipse cx="1040" cy="143" rx="360" ry="180" fill="url(#violet-haze)"/>
    <path d="M 14 144 C 150 188, 246 179, 383 153" fill="none" stroke="#d08b46" stroke-opacity="0.13" stroke-width="1.4"/>
    <path d="M 645 175 C 830 104, 1004 58, 1210 116" fill="none" stroke="url(#arc)" stroke-width="1.4"/>
    <path class="light-trail" d="M 645 175 C 830 104, 1004 58, 1210 116" fill="none" stroke="#9584ff" stroke-opacity="0.65" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 792 190 C 956 123, 1096 117, 1220 151" fill="none" stroke="#877bea" stroke-opacity="0.12" stroke-width="1.4"/>
    <circle cx="1112" cy="119" r="1.7" fill="#aa94ff" opacity="0.64"/>
  </g>
  <rect x="9.75" y="9.75" width="1180.5" height="160.5" rx="21.25" fill="none" stroke="url(#outline)" stroke-width="1.5"/>

  <circle cx="104" cy="90" r="47" fill="#f2a34e" fill-opacity="0.045" stroke="#f2a34e" stroke-opacity="0.22" stroke-width="1.3"/>
  <circle cx="104" cy="90" r="36" fill="#f2a34e" fill-opacity="0.085" stroke="#f2a34e" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle class="motion" cx="104" cy="90" r="48" fill="none" stroke="#f6b363" stroke-width="1.2" stroke-opacity="0.4">
    <animate attributeName="r" values="43;55;55" keyTimes="0;0.62;1" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.32;0;0" keyTimes="0;0.62;1" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle class="motion" cx="104" cy="90" r="48" fill="none" stroke="#f6b363" stroke-width="1.2" stroke-opacity="0.4">
    <animate attributeName="r" values="43;55;55" keyTimes="0;0.62;1" dur="4.8s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.32;0;0" keyTimes="0;0.62;1" dur="4.8s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <path d="M 104 110 C 99 106 86 97 86 86 C 86 78 96 74 104 83 C 112 74 122 78 122 86 C 122 97 109 106 104 110 Z"
        fill="none" stroke="#f6ab58" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g class="motion">
    <circle cx="104" cy="42" r="2.2" fill="#ffc47a">
      <animateTransform attributeName="transform" type="rotate" from="0 104 90" to="360 104 90" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="178" y="88" fill="#f5f6ff" font-size="38" font-weight="750" letter-spacing="-0.7">Contributing</text>
  <text x="180" y="121" fill="#aeb9d8" font-size="16" font-weight="400">Bug reports, pull requests and the checks they run</text>
  <text x="1153" y="42" text-anchor="end" fill="#f6a64e" font-size="12" font-weight="700" letter-spacing="1.2">NEXUSMODS BYPASS</text>
</svg>
