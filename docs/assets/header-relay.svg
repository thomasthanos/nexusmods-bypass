<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="t d">
  <title id="t">Bug-report relay</title><desc id="d">The Cloudflare Worker that forwards opt-in reports</desc>
  <style>text { font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; } .glow-a { animation: drift 14s ease-in-out infinite alternate; } .halo { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
  @keyframes drift { to { transform: translate(120px, 20px); } } @keyframes pulse { 0%,100% { transform: scale(.92); opacity: .65; } 50% { transform: scale(1.06); opacity: 1; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151c31"/><stop offset="1" stop-color="#0e1325"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#aab4ff" stop-opacity=".26"/><stop offset="1" stop-color="#aab4ff" stop-opacity=".07"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f0a24d"/><stop offset=".5" stop-color="#8b83ff"/><stop offset="1" stop-color="#45c8e6"/></linearGradient>
    <radialGradient id="glowA"><stop stop-color="#f0a24d" stop-opacity=".35"/><stop offset="1" stop-color="#f0a24d" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop stop-color="#8b83ff" stop-opacity=".32"/><stop offset="1" stop-color="#8b83ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x=".75" y=".75" width="1198.5" height="178.5" rx="26" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5"/>
  <ellipse class="glow-a" cx="260" cy="60" rx="300" ry="120" fill="url(#glowA)"/>
  <ellipse cx="1000" cy="150" rx="320" ry="120" fill="url(#glowB)"/>
  <circle class="halo" cx="108" cy="90" r="44" fill="#f0a24d" fill-opacity=".08" stroke="#f0a24d" stroke-opacity=".4"/>
  <rect x="78" y="60" width="60" height="60" rx="17" fill="#f0a24d" fill-opacity=".14" stroke="#f0a24d" stroke-opacity=".55"/>
  <g transform="translate(92 74) scale(1)" fill="none" stroke="#f0a24d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 24h14a5 5 0 0 0 0-10 7 7 0 0 0-13.5-1A5.5 5.5 0 0 0 9 24z"/></g>
  <text x="176" y="86" font-size="36" font-weight="750" fill="#f1f4ff" letter-spacing="-.8">Bug-report relay</text>
  <text x="178" y="120" font-size="16" fill="#9aa3c7">The Cloudflare Worker that forwards opt-in reports</text>
  <text x="1150" y="44" font-size="12" font-weight="700" fill="#f0a24d" text-anchor="end" letter-spacing="1.2">NEXUSMODS BYPASS</text>
</svg>
