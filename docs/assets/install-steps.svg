<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="t d">
  <title id="t">Install in three steps</title>
  <desc id="d">Download: The ZIP for your browser from Releases; Load it: Load unpacked, or about:debugging in Firefox; Sign in: Sign in to Nexus Mods and open a mod page</desc>
  <style>text { font-family: "Segoe UI Variable Display", "Segoe UI", Arial, sans-serif; }
    .sheen { animation: glassSweep 10s ease-in-out infinite; }
    @keyframes glassSweep {
      0%, 8% { transform: translateX(0); opacity: 0; }
      18% { opacity: .45; }
      62% { transform: translateX(1380px); opacity: .45; }
      70%, 100% { transform: translateX(1380px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sheen { opacity: 0; } }
    text { text-anchor:middle; } .title { font-size:19px; font-weight:700; fill:#f4f5f8; } .desc { font-size:13.5px; fill:#b8b9c3; }
    .node { animation: confirm 6s ease-in-out infinite; }
    @keyframes confirm { 0%,100% { stroke-opacity:.35; } 15%,35% { stroke-opacity:1; } }
  </style>
  <defs>
    <linearGradient id="face" x2=".7" y2="1"><stop stop-color="#30343d"/><stop offset=".48" stop-color="#191c25"/><stop offset="1" stop-color="#24201e"/></linearGradient>
    <linearGradient id="edge" x2=".8" y2="1"><stop stop-color="#f4e5d4" stop-opacity=".48"/><stop offset=".45" stop-color="#b9bfd1" stop-opacity=".1"/><stop offset="1" stop-color="#eaa14c" stop-opacity=".32"/></linearGradient>
    <linearGradient id="tile" x2=".7" y2="1"><stop stop-color="#d3ae7d" stop-opacity=".38"/><stop offset=".5" stop-color="#644a32" stop-opacity=".6"/><stop offset="1" stop-color="#261e19" stop-opacity=".95"/></linearGradient>
    <linearGradient id="accent" x2="0" y2="1"><stop stop-color="#ffe4b9"/><stop offset=".5" stop-color="#eaa14c"/><stop offset="1" stop-color="#9c652b"/></linearGradient>
    <linearGradient id="glass-reflection" x2="1" y2=".3"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="glass-clip"><rect x="1" y="1" width="1198" height="174" rx="24"/></clipPath>

  </defs>
  <rect x=".75" y=".75" width="1198.5" height="174.5" rx="24" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M24 2H1176" stroke="#fff" stroke-opacity=".12" stroke-linecap="round"/>
  <g clip-path="url(#glass-clip)"><path class="sheen" d="M-170 0H-90L86 176H6Z" fill="url(#glass-reflection)"/></g>
  <path d="M236 66H564M636 66H964" stroke="#fff" stroke-opacity=".10" stroke-width="3" stroke-linecap="round"/>
  <g><circle cx="200" cy="70" r="30" fill="#0a0c10"/><circle cx="200" cy="66" r="30" fill="url(#tile)" stroke="url(#edge)" stroke-width="1.5"/><circle class="node" style="animation-delay:0.0s" cx="200" cy="66" r="30" fill="none" stroke="url(#accent)" stroke-width="1.2"/><g transform="translate(186.0 52) scale(0.875)" fill="none" stroke="#f2b974" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5v15m-7-7 7 7 7-7M7 25h18"/></g><text x="200" y="128" class="title">Download</text><text x="200" y="152" class="desc">The ZIP for your browser from Releases</text></g><g><circle cx="600" cy="70" r="30" fill="#0a0c10"/><circle cx="600" cy="66" r="30" fill="url(#tile)" stroke="url(#edge)" stroke-width="1.5"/><circle class="node" style="animation-delay:1.5s" cx="600" cy="66" r="30" fill="none" stroke="url(#accent)" stroke-width="1.2"/><g transform="translate(586.0 52) scale(0.875)" fill="none" stroke="#f2b974" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h6a3 3 0 1 1 6 0h6v6a3 3 0 1 0 0 6v6h-6a3 3 0 1 0-6 0H6v-6a3 3 0 1 1 0-6z"/></g><text x="600" y="128" class="title">Load it</text><text x="600" y="152" class="desc">Load unpacked, or about:debugging in Firefox</text></g><g><circle cx="1000" cy="70" r="30" fill="#0a0c10"/><circle cx="1000" cy="66" r="30" fill="url(#tile)" stroke="url(#edge)" stroke-width="1.5"/><circle class="node" style="animation-delay:3.0s" cx="1000" cy="66" r="30" fill="none" stroke="url(#accent)" stroke-width="1.2"/><g transform="translate(986.0 52) scale(0.875)" fill="none" stroke="#f2b974" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14h16v12H8zM11 14V10a5 5 0 0 1 10 0v4"/></g><text x="1000" y="128" class="title">Sign in</text><text x="1000" y="152" class="desc">Sign in to Nexus Mods and open a mod page</text></g>
</svg>
