<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="t"><title id="t">NexusMods Bypass by ThomasThanos. Not affiliated with Nexus Mods.</title>
  <style>text { font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; } .g { animation: drift 12s ease-in-out infinite alternate; } @keyframes drift { to { transform: translateX(160px); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151c31"/><stop offset="1" stop-color="#0e1325"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#aab4ff" stop-opacity=".26"/><stop offset="1" stop-color="#aab4ff" stop-opacity=".07"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f0a24d"/><stop offset=".5" stop-color="#8b83ff"/><stop offset="1" stop-color="#45c8e6"/></linearGradient>
    <radialGradient id="glowA"><stop stop-color="#f0a24d" stop-opacity=".35"/><stop offset="1" stop-color="#f0a24d" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop stop-color="#8b83ff" stop-opacity=".32"/><stop offset="1" stop-color="#8b83ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x=".75" y=".75" width="1198.5" height="118.5" rx="24" fill="url(#face)" stroke="url(#edge)" stroke-width="1.5"/>
  <ellipse class="g" cx="440" cy="60" rx="300" ry="70" fill="url(#glowA)"/>
  <text x="600" y="54" font-size="20" font-weight="700" fill="#eef0ff">Built with care by <tspan fill="#f0a24d">ThomasThanos</tspan></text>
  <text x="600" y="82" font-size="13.5" fill="#9aa3c7">Not affiliated with, endorsed by, or connected to Nexus Mods.</text>
</svg>
