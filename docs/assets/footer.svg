<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" role="img" aria-labelledby="footer-title footer-description">
  <title id="footer-title">Built with care by ThomasT</title>
  <desc id="footer-description">GitHub profile of ThomasT. Not affiliated with, endorsed by, or connected to Nexus Mods.</desc>
  <style>
    text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
    .light-trail { stroke-dasharray: 65 640; animation: footer-travel 12s linear infinite; }
    @keyframes footer-travel { to { stroke-dashoffset: -705; } }
    @media (prefers-reduced-motion: reduce) { .light-trail { display: none; } .motion { display: none; } }
  </style>
  <defs>
    <linearGradient id="panel" x1="8" y1="0" x2="1192" y2="156" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171c2c"/><stop offset=".50" stop-color="#121a2a"/><stop offset="1" stop-color="#1c1d36"/>
    </linearGradient>
    <linearGradient id="stroke" x1="8" y1="6" x2="1192" y2="149" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6d6e83" stop-opacity=".64"/><stop offset=".55" stop-color="#59617f" stop-opacity=".42"/><stop offset="1" stop-color="#a47550" stop-opacity=".56"/>
    </linearGradient>
    <linearGradient id="gold" x1="34" y1="35" x2="185" y2="111" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffdfae"/><stop offset=".60" stop-color="#f4b666"/><stop offset="1" stop-color="#e39342"/>
    </linearGradient>
    <radialGradient id="amber-glow">
      <stop stop-color="#f6ad57" stop-opacity=".22"/><stop offset=".55" stop-color="#f6ad57" stop-opacity=".075"/><stop offset="1" stop-color="#f6ad57" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow">
      <stop stop-color="#8273e8" stop-opacity=".20"/><stop offset=".65" stop-color="#8273e8" stop-opacity=".055"/><stop offset="1" stop-color="#8273e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="highlight" x1="755" y1="114" x2="1144" y2="114" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b48952" stop-opacity="0"/><stop offset=".42" stop-color="#f0ac62" stop-opacity=".40"/><stop offset="1" stop-color="#a590f6" stop-opacity=".16"/>
    </linearGradient>
    <clipPath id="card-clip"><rect x="8" y="8" width="1184" height="140" rx="21"/></clipPath>
  </defs>

  <rect x="8" y="8" width="1184" height="140" rx="21" fill="url(#panel)"/>
  <g clip-path="url(#card-clip)">
    <ellipse cx="175" cy="62" rx="360" ry="160" fill="url(#amber-glow)"/>
    <ellipse cx="1090" cy="109" rx="370" ry="170" fill="url(#violet-glow)"/>
    <path d="M 25 8 H 470" stroke="#ffe2b5" stroke-opacity=".11" stroke-width="1.2"/>
    <path d="M 756 113 H 1144" stroke="url(#highlight)" stroke-width="1.6" stroke-linecap="round"/>
    <path class="light-trail" d="M 756 113 H 1144" stroke="#ffc584" stroke-opacity=".70" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="8.75" y="8.75" width="1182.5" height="138.5" rx="20.25" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>

  <rect x="43" y="33" width="75" height="75" rx="20" fill="#f2a34e" fill-opacity=".09" stroke="#f2a34e" stroke-opacity=".36" stroke-width="1.4"/>
  <rect x="49" y="39" width="63" height="63" rx="16" fill="#101725" fill-opacity=".63" stroke="#f0ad65" stroke-opacity=".26"/>
  <text x="80" y="81" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="-2" fill="url(#gold)">TT</text>
  <circle class="motion" cx="114" cy="36" r="2.3" fill="#ffc37d">
    <animate attributeName="opacity" values=".30;1;.30" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <text x="143" y="54" font-size="18" font-weight="500" fill="#bfc6d9">Built with care by</text>
  <text x="141" y="97" font-size="39" font-weight="800" letter-spacing="-.8" fill="url(#gold)">ThomasT</text>

  <path d="M 678 34 V 113" stroke="#8290bb" stroke-opacity=".22" stroke-width="1.3"/>
  <text x="1147" y="54" text-anchor="end" fill="#f6af61" font-size="18" font-weight="750" letter-spacing="2.1">THOMASTHANOS</text>
  <text x="1147" y="91" text-anchor="end" fill="#e2e8f7" font-size="23" font-weight="600">GitHub profile ↗</text>

  <path d="M 43 120 H 1157" stroke="#afb9d3" stroke-opacity=".16" stroke-width="1"/>
  <text x="44" y="140" font-size="15.3" fill="#aeb7cd">Not affiliated with, endorsed by, or connected to Nexus Mods.</text>
</svg>
