<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" role="img" aria-labelledby="footer-title footer-description">
  <title id="footer-title">Built with care by ThomasT</title>
  <desc id="footer-description">GitHub profile of Thomas Thanos (@thomasthanos). Not affiliated with Nexus Mods.</desc>
  <style>
    text { font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    .sheen { animation: glassSweep 10s ease-in-out infinite; }
    @keyframes glassSweep {
      0%, 8% { transform: translateX(0); opacity: 0; }
      18% { opacity: .40; }
      60% { transform: translateX(1380px); opacity: .40; }
      70%, 100% { transform: translateX(1380px); opacity: 0; }
    }
    .pulse-glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: .35; transform: scale(1); }
      50% { opacity: .9; transform: scale(1.15); }
    }
    .hover-card { transition: all 0.3s ease; }
    @media (prefers-reduced-motion: reduce) {
      .sheen, .pulse-glow { animation: none !important; }
      .sheen { opacity: 0; }
    }
  </style>
  <defs>
    <!-- Background Surface: Matches hero.svg & features.svg Obsidian Palette -->
    <linearGradient id="bg-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#262b36"/>
      <stop offset="50%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#1f1b22"/>
    </linearGradient>
    
    <!-- Outer Rim Metallic Stroke -->
    <linearGradient id="bg-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e5d4" stop-opacity=".50"/>
      <stop offset="45%" stop-color="#9aa5be" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#eaa14c" stop-opacity=".45"/>
    </linearGradient>

    <!-- Warm Amber Glow on Author side -->
    <radialGradient id="glow-amber" cx="15%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#eaa14c" stop-opacity=".24"/>
      <stop offset="55%" stop-color="#eaa14c" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#eaa14c" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Violet Glow on GitHub side -->
    <radialGradient id="glow-violet" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8072e6" stop-opacity=".20"/>
      <stop offset="60%" stop-color="#8072e6" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#8072e6" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Metallic Text & Icon -->
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5e6"/>
      <stop offset="50%" stop-color="#f5ba6d"/>
      <stop offset="100%" stop-color="#e29544"/>
    </linearGradient>

    <!-- Avatar Plate -->
    <linearGradient id="avatar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d3345"/>
      <stop offset="50%" stop-color="#181c28"/>
      <stop offset="100%" stop-color="#10131b"/>
    </linearGradient>
    <linearGradient id="avatar-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe4ba" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#eaa14c" stop-opacity=".35"/>
    </linearGradient>

    <!-- GitHub Pill Button -->
    <linearGradient id="btn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#282f42" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#131620" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="btn-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#8e9bb5" stop-opacity=".15"/>
    </linearGradient>

    <!-- Glass Reflection Sheen -->
    <linearGradient id="glass-reflection" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card-clip"><rect x="1" y="1" width="1198" height="154" rx="24"/></clipPath>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="1198" height="154" rx="24" fill="url(#bg-face)" stroke="url(#bg-edge)" stroke-width="1.6"/>

  <!-- Glows & Highlights -->
  <g clip-path="url(#card-clip)">
    <rect x="1" y="1" width="1198" height="154" fill="url(#glow-amber)"/>
    <rect x="1" y="1" width="1198" height="154" fill="url(#glow-violet)"/>
    <path d="M 28 2 H 1172" stroke="#ffffff" stroke-opacity=".14" stroke-linecap="round"/>
    <!-- Glass Sheen Sweep -->
    <path class="sheen" d="M -180 0 H -80 L 76 156 H -24 Z" fill="url(#glass-reflection)"/>
  </g>

  <!-- Left: Avatar & Identity -->
  <!-- Avatar Shadow & Plate -->
  <rect x="44" y="34" width="76" height="76" rx="22" fill="#06080d" fill-opacity=".45"/>
  <rect x="44" y="32" width="76" height="76" rx="22" fill="url(#avatar-bg)" stroke="url(#avatar-edge)" stroke-width="1.5"/>
  
  <!-- Subtle inner tile glow -->
  <circle cx="82" cy="70" r="26" fill="#eaa14c" fill-opacity=".15"/>
  
  <!-- TT Monogram -->
  <text x="82" y="80.5" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="-1.5" fill="url(#gold-grad)">TT</text>

  <!-- Active Status Indicator Dot -->
  <circle cx="115" cy="37" r="4.5" fill="#141720"/>
  <circle cx="115" cy="37" r="3" fill="#22c55e"/>
  <circle class="pulse-glow" cx="115" cy="37" r="5.5" fill="none" stroke="#22c55e" stroke-width="1.2"/>

  <!-- Author Name & Title -->
  <text x="138" y="55" font-size="14" font-weight="650" fill="#9da6ba" letter-spacing="1.5">BUILT WITH CARE BY</text>
  <text x="138" y="94" font-size="36" font-weight="850" letter-spacing="-0.5" fill="url(#gold-grad)">ThomasT</text>

  <!-- Middle Divider Accent -->
  <path d="M 680 34 V 104" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Right: GitHub Profile Pill Card -->
  <g transform="translate(740, 36)" class="hover-card">
    <rect x="0" y="0" width="416" height="68" rx="20" fill="url(#btn-bg)" stroke="url(#btn-edge)" stroke-width="1.3"/>
    
    <!-- GitHub Octocat Icon In Badge -->
    <g transform="translate(16, 14)">
      <rect x="0" y="0" width="40" height="40" rx="12" fill="#0f121a" stroke="#ffffff" stroke-opacity=".14"/>
      <path transform="translate(8, 8) scale(0.75)" fill="#f3f4f7" d="M16 0C7.16 0 0 7.16 0 16c0 7.08 4.59 13.08 10.96 15.2.8.15 1.1-.35 1.1-.77 0-.38-.01-1.39-.02-2.73-4.45.97-5.39-2.15-5.39-2.15-.73-1.85-1.78-2.34-1.78-2.34-1.45-.99.11-.97.11-.97 1.61.11 2.45 1.65 2.45 1.65 1.43 2.44 3.74 1.74 4.66 1.33.14-1.04.56-1.74 1.02-2.14-3.55-.4-7.29-1.78-7.29-7.91 0-1.75.62-3.17 1.65-4.29-.17-.4-.71-2.03.16-4.23 0 0 1.34-.43 4.4 1.64 1.28-.36 2.65-.54 4.01-.54s2.73.18 4.01.54c3.05-2.07 4.39-1.64 4.39-1.64.87 2.2.33 3.83.16 4.23 1.03 1.11 1.64 2.54 1.64 4.29 0 6.15-3.75 7.5-7.32 7.9.57.5 1.08 1.47 1.08 2.97 0 2.15-.02 3.88-.02 4.41 0 .43.29.93 1.11.77C27.42 29.07 32 23.07 32 16c0-8.84-7.16-16-16-16z"/>
    </g>

    <!-- Profile Text -->
    <text x="68" y="28" font-size="12" font-weight="750" fill="#f5ba6d" letter-spacing="1.5">THOMASTHANOS</text>
    <text x="68" y="50" font-size="16.5" font-weight="650" fill="#f0f3fa">View GitHub profile</text>

    <!-- Stylized Arrow Tag on Right -->
    <g transform="translate(366, 20)">
      <circle cx="14" cy="14" r="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
      <path d="M10 18 L18 10 M11 10 H18 V17" fill="none" stroke="#f0b86e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Bottom Divider & Legal Strip -->
  <path d="M 44 122 H 1156" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
  <text x="46" y="141" font-size="13" font-weight="500" fill="#8892a6" letter-spacing="0.2">NexusMods Bypass is an independent open-source project. Not affiliated with, endorsed by, or connected to Nexus Mods.</text>
</svg>
