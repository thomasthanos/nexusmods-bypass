name = "nexusmods-bypass-relay"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Origins allowed by CORS (prefix match). Extension pages send their own origin.
ALLOWED_ORIGINS = "chrome-extension://,moz-extension://,extension://"
# Fixed recipient for user reports. This public Discord user ID is not a credential.
REPORT_MENTION_USER_ID = "706932839907852389"
# Comparison baseline for labelling older clients; update when deploying a relay for a new release.
RELAY_EXTENSION_VERSION = "3.3.6"

# Shared counters and auto-report fingerprints across Worker instances (eventually consistent).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "05224173d3444f47a4130c0061ed3b09"

# The extension posts explicit opt-in diagnostics through this existing relay origin.
# Only the fixed public ingest and heartbeat routes are forwarded; admin APIs stay private.
[[services]]
binding = "DIAGNOSTICS"
service = "nexusmods-diagnostics"

# Secrets (never put them in this file):
#   npx wrangler secret put DISCORD_WEBHOOK_URL
#   npx wrangler secret put RESEND_API_KEY        (optional, e-mail)
#   npx wrangler secret put REPORT_EMAIL_TO       (optional)
#   npx wrangler secret put REPORT_EMAIL_FROM     (optional, a verified Resend sender)
